# This is a Declarative Automation Bundle definition for bhp_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bhp_bundle
  uuid: eb6a6e56-24dd-4699-859f-6d6d2ac2b636

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619221451963.3.azuredatabricks.net
    variables:
      catalog: bhp_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405619221451963.3.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/vijoyjoseph@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vijoyjoseph@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bhp_dev
      schema: prod
    permissions:
      - user_name: vijoyjoseph@outlook.com
        level: CAN_MANAGE
